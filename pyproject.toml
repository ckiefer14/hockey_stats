[project]
name = "hockey-stats"
version = "1.1.0"
description = "NHL prediction with uncertainty quantification: xG, hierarchical Bayesian team ratings, game simulation, validation and Sobol' sensitivity"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pydantic>=2.0",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "scikit-learn",
    "lightgbm",
    "joblib",
    "pymc",
    "arviz",
    "h5netcdf",
    "h5py",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "jupyter",
    "nbformat",
]